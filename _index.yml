indexpage:
  title: StorageGRID 12.0 ソフトウェアドキュメント
  summary: NetApp StorageGRID は、パブリック、プライベート、ハイブリッドマルチクラウド環境における幅広いユースケースをサポートする、ソフトウェアで定義されるオブジェクトストレージスイートです。StorageGRID
    は Amazon S3 API のネイティブサポートを提供し、自動化されたライフサイクル管理などの業界をリードする革新的な機能により、非構造化データを長期間にわたってコスト効率よく保存、セキュリティ保護、保護、保全します。
